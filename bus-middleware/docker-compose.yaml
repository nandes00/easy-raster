services:
  tracker:
    build: .
    volumes:
      - .:/app
      - ./data:/app/data
    ports:
      - "9000:9000/udp"
    environment:
      UDP_ADDR: ":9000"
      LOG_LEVEL: "info"
      AWS_REGION: "${AWS_REGION}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      SQS_QUEUE_URL: "${SQS_QUEUE_URL}"