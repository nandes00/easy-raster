include:
  - ../mongodb/docker-compose.yaml
  - ../kafka/docker-compose.yaml

services:
  admin-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://root:root@mongo:27017/tracking?authSource=admin&directConnection=true
      - KAFKA_BROKER=kafka:9092
      - KAFKA_CLIENT_TOPIC=tracking.client.events
      - HTTP_PORT=8080
    depends_on:
      - mongo
      - kafka
    volumes:
      - .:/app
    command: go run ./cmd
